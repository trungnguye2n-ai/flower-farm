# Local development: expose services on localhost only, add the test database.
services:
  db:
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - ./infra/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
  minio:
    ports: ["127.0.0.1:59100:9000", "127.0.0.1:59101:9001"]
  app:
    ports: ["127.0.0.1:3000:3000"]
