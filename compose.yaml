# Shared services. Combine with compose.dev.yaml (local) or compose.prod.yaml (VPS).
name: vuon-hoa

# Inside the compose network the app reaches db and minio by service name
x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  S3_ENDPOINT: http://minio:9000

x-minio-image: &minio-image cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d

services:
  db:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: *minio-image
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@127.0.0.1:9000
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: create the bucket and make only public/ readable anonymously
  minio-init:
    image: *minio-image
    entrypoint: ["sh", "/init.sh"]
    environment:
      MC_HOST_store: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
      S3_BUCKET: ${S3_BUCKET:?}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Applies pending migrations, then exits; app waits for it
  migrate:
    build: { context: ., target: tools }
    image: ${IMAGE_REPO:-vuon-hoa}-tools:${IMAGE_TAG:-local}
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: { context: ., target: runner }
    image: ${IMAGE_REPO:-vuon-hoa}:${IMAGE_TAG:-local}
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
